[project]
name = "volum"
description = "Local-first image-to-3D engine and CLI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "../LICENSE" }
dynamic = ["version"]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
    "huggingface-hub>=0.24",
    "trimesh>=4.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
engine = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
]
imaging = [
    "pillow>=10.3",
    "numpy>=1.26",
]
mesh = [
    "trimesh>=4.4",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
volum = "volum_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/volum_core/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/volum_core", "src/volum_cli", "src/volum_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/volum_core/providers/shims" = "volum_core/providers/shims"
"src/volum_core/py.typed" = "volum_core/py.typed"
"src/volum_cli/py.typed" = "volum_cli/py.typed"
"src/volum_engine/py.typed" = "volum_engine/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a real GPU and installed model weights (excluded from CI)",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S", "PL"]
ignore = ["A003", "PLR0911", "PLR0912"]

[tool.ruff.lint.isort]
# Declared rather than detected. Ruff infers first-party packages from the
# filesystem, so a checkout with a built virtualenv classifies volum_* as
# first-party while a clean one does not — which made lint pass locally and
# fail in CI on identical files.
known-first-party = ["volum_core", "volum_cli", "volum_engine"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and reach into private helpers on purpose.
"tests/**" = ["S101", "SLF001", "PLR2004", "PLR0913"]
# Worker scripts run in a *provider's* virtual environment, not the engine's.
# Their imports must happen after sys.path is prepared and are unavailable here,
# so module-level imports are wrong by construction.
"src/volum_core/providers/workers/*" = ["PLC0415"]
# A CLI command's parameters ARE its flags; counting them as a code smell would
# only push the flags somewhere the framework cannot see them.
"src/volum_cli/main.py" = ["PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["volum_core", "volum_cli", "volum_engine"]

[[tool.mypy.overrides]]
# Optional runtime probes: deliberately absent from the engine environment,
# because the ML stack lives in per-provider virtualenvs.
module = [
    "psutil.*",
    "trimesh.*",
    "torch.*",
    "mlx.*",
    "mcubes.*",
    "numpy.*",
    "huggingface_hub.*",
    "PIL.*",
    # The cloned upstream model implementation; present only in a provider venv.
    "tsr.*",
]
ignore_missing_imports = true
