name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never touch a real user data directory.
  VOLUM_DATA_DIR: ${{ github.workspace }}/.volum-ci-data

jobs:
  engine:
    name: Engine (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon: the primary target must be tested on the
        # architecture it targets, not only on x86 Linux.
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install
        run: uv sync --extra dev --extra engine --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run --with mypy mypy

      - name: Type check against the other target platforms
        # mypy narrows sys.platform and os-specific branches to the platform it
        # runs on, so a type error can exist on Windows and be invisible on
        # Linux. Checking all three from one runner catches that in seconds
        # instead of after a full matrix round trip.
        if: runner.os == 'Linux'
        run: |
          for platform in win32 darwin linux; do
            echo "--- $platform ---"
            uv run --with mypy mypy --platform "$platform"
          done

      - name: Test
        # No GPU on any runner, so GPU tests are excluded here by design and run
        # as an optional smoke test elsewhere (spec sections 37 and 38).
        run: uv run pytest -m "not gpu" --cov=volum_core --cov-report=term-missing

      - name: Doctor runs on a clean machine
        # Regression guard: the doctor once reported "no usable runtime" for
        # every model on a capable machine simply because no provider was
        # installed yet. On a fresh runner it must still produce a report.
        run: uv run volum doctor

  desktop:
    name: Desktop window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The window is where the licence text, the hardware verdicts and the
      # printability warnings are read, so it is checked on the platform it
      # targets first and on Linux for the cheap, fast signal.
      matrix:
        os: [macos-14, ubuntu-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the frontend
        run: pnpm build

  shell:
    name: Desktop shell (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux build needs the system webview and its dependencies.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # The build script reads tauri.conf.json, which names ../dist. It does
      # not need the real frontend to compile, only for the directory to exist.
      - name: Placeholder frontend
        run: mkdir -p ../dist && touch ../dist/index.html

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # The end-to-end test is #[ignore]d: it needs uv and a synced engine and
        # runs locally. Everything else is pure and runs here.
        run: cargo test

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every version target matches the single source of truth
        run: python3 scripts/sync_version.py --check

  licences:
    name: Licence documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No model weights in the repository
        # Weights are downloaded into the data directory, never committed.
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(safetensors|ckpt|pth|pt|bin|gguf|onnx)$'; then
            echo "::error::Model weights must never be committed. See docs/licenses.md."
            exit 1
          fi
          echo "No weight files tracked."

      - name: Required documents are present
        run: |
          set -euo pipefail
          for f in README.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md \
                   docs/licenses.md docs/architecture.md docs/privacy.md \
                   docs/packaging.md; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          echo "All required documents present."
