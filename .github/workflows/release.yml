name: Release

# Deliberately not on every push: a build produces three installers of a few
# hundred megabytes each, and there is no reason to make them until someone
# wants them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only, and on purpose: an x86-64 slice could not run
          # the primary provider, so a universal binary would ship half an
          # application (docs/architecture.md §10).
          - os: macos-14
            label: macOS (Apple Silicon)
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: Windows (x64)
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            label: Linux (x64)
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri's Linux build needs the system webview; AppImage needs FUSE.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libfuse2

      # A relocatable CPython with the engine installed into it, built for this
      # runner's own platform — which is why there is a runner per platform.
      # The script verifies what it built before it returns.
      - name: Build the engine runtime
        run: python scripts/build_runtime.py

      - name: Install the frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Bundle
        working-directory: apps/desktop
        shell: bash
        # CI is already true here, which is what makes Tauri pass
        # --skip-jenkins to create-dmg on macOS. Without it the DMG step hangs
        # on a Finder window it opens and never closes.
        #
        # Retried because macOS runners intermittently fail hdiutil with a
        # SPURIOUS "No space left on device" — a known diskimages-helper flake
        # rather than actual disk pressure, seen repeatedly in this workspace's
        # other projects. The Rust build is cached, so a retry only repeats the
        # bundling. Each attempt is logged; three failures are a real failure.
        run: |
          attempt=1
          until pnpm tauri build; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::bundling failed $attempt times"
              exit 1
            fi
            echo "::warning::bundling attempt $attempt failed; retrying"
            attempt=$((attempt + 1))
            df -h /
            sleep 10
          done

      - name: What was built
        shell: bash
        run: |
          find apps/desktop/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: volum-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  draft:
    name: Draft release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A draft, never a published release. What reaches people is a decision
      # a person makes, not something a tag does on their behalf.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
          body: |
            Built from ${{ github.ref_name }}.

            **These binaries are unsigned.** macOS will refuse to open the
            application until the quarantine attribute is removed:

                xattr -dr com.apple.quarantine /Applications/VOLUM.app

            Windows SmartScreen will warn for the same reason. Signing needs
            certificates this project does not have; see `docs/packaging.md`.
